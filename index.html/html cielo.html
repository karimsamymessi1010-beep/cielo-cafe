      { id: 1303, name: 'ايس ماتشا لاتيه', category: 'ماتشا', price: 125, image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300' },
      { id: 1304, name: 'ايس ماتشا فراولة', category: 'ماتشا', price: 140, image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300' },
      { id: 1305, name: 'ايس ماتشا مانجو', category: 'ماتشا', price: 140, image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300' },
      { id: 1306, name: 'ايس ماتشا اسبرسو', category: 'ماتشا', price: 145, image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300' },

      // 14. الحلويات[cite: 2]
      { id: 1401, name: 'تشيز كيك', category: 'حلويات', price: 85, image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=300' },
      { id: 1402, name: 'فادج كيك', category: 'حلويات', price: 90, image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300' }
    ];

    let currentCategory = 'الكل';

    // عرض أزرار الأقسام
    function renderCategories() {
      const container = document.getElementById('categories-list');
      container.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')" 
          class="px-4 py-2 rounded-2xl whitespace-nowrap text-sm font-medium transition-all shadow-sm ${
            currentCategory === cat 
              ? 'bg-cielo-green text-cielo-gold font-bold shadow' 
              : 'bg-white text-cielo-green border border-cielo-wood/10 hover:bg-cielo-beige'
          }">
          ${cat}
        </button>
      `).join('');
    }

    // عرض المنتجات
    function renderMenu() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('menu-items');
      
      const filtered = menuData.filter(item => {
        const matchesCat = currentCategory === 'الكل' || item.category === currentCategory;
        const matchesSearch = item.name.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i data-lucide="coffee" class="w-12 h-12 mx-auto mb-2 opacity-30"></i>
            <p>لا توجد مشروبات متطابقة في هذا القسم حالياً</p>
          </div>
        `;
      } else {
        container.innerHTML = filtered.map(item => `
          <div class="bg-white p-3.5 rounded-2xl shadow-sm flex items-center border border-cielo-wood/10 hover:shadow-md transition">
            <img src="${item.image}" alt="${item.name}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0">
            <div class="flex-1 mr-4">
              <div class="flex justify-between items-center">
                <h3 class="font-bold text-cielo-green text-base">${item.name}</h3>
                <span class="text-cielo-wood font-bold text-sm bg-cielo-beige px-2.5 py-1 rounded-lg border border-cielo-wood/10">${item.price} ج.م</span>
              </div>
              <span class="inline-block mt-2 text-[10px] text-cielo-green/70 bg-cielo-green/5 px-2 py-0.5 rounded-full font-medium">${item.category}</span>
            </div>
          </div>
        `).join('');
      }

      lucide.createIcons();
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderMenu();
    }

    // التشغيل الأولي
    renderCategories();
    renderMenu();
    lucide.createIcons();
  </script>
</body>
</html>
